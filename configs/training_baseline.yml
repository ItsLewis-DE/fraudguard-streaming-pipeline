schema_version: 1
experiment_name: fraudguard_logistic_baseline

dataset:
  relation: fraudguard_ml.ml_training_transactions
  prediction_point: post_ledger_update
  id_columns:
    - source
    - event_id
  split_columns:
    - event_time
    - event_date
    - step
  feature_columns:
    - transaction_type
    - amount
    - origin_balance_before
    - destination_balance_before
  target_column: is_fraud
  forbidden_feature_columns:
    - source
    - event_id
    - event_time
    - event_date
    - step
    - origin_account
    - destination_account
    - is_fraud
    - is_flagged_fraud

split:
  strategy: temporal
  train_end: "2026-01-01T02:00:00Z"
  validation_end: "2026-01-01T04:00:00Z"
  test_end: "2026-01-01T06:00:00Z"

snapshot:
  storage_uri: s3://fraud-training-snapshots
  format: parquet
  compression: zstd
  fingerprint_algorithm: clickhouse_cityhash64_xor_v1
  label_policy: static_final_labels

model:
  kind: logistic_regression
  class_weight: balanced
  regularization_c: 1.0
  max_iter: 500

evaluation:
  threshold_strategy: max_recall_at_min_precision
  min_precision: 0.10

runtime:
  random_seed: 42
